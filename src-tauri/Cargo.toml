[package]
name = "small-ai-studio"
version = "0.1.0"
description = "Small AI Studio - Lightweight Claude Desktop-styled AI workspace with Pi Agent, custom llama.cpp, AMD XDNA/XDNA2 NPU support, and RAG"
authors = ["Small AI Studio Contributors"]
edition = "2021"

[lib]
name = "small_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
scraper = "0.20"
regex = "1.10"
urlencoding = "2.1"
rusqlite = { version = "0.31", features = ["bundled"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common"
] }
